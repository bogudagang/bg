<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boguda Gang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F2B01E; --red:#D62E2E; --teal:#0E4B4F; --cream:#FFF6DC; --ink:#1B1B1B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}

  /* Hero */
  .hero{background:var(--yellow);border-bottom:8px solid var(--teal);padding:64px 20px 72px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(14,75,79,.08) 38px 40px)}
  .hero h1{font-family:'Bungee',sans-serif;font-size:clamp(2.6rem,10vw,6.5rem);line-height:.95;color:var(--teal);position:relative;text-shadow:4px 4px 0 var(--cream)}
  .hero h1 span{display:block;color:var(--red)}
  .hero p{position:relative;margin-top:22px;font-weight:600;font-size:1.15rem;color:var(--ink)}
  .sticker{position:relative;display:inline-block;margin-top:26px;background:var(--red);color:var(--cream);font-family:'Bungee',sans-serif;padding:8px 18px;transform:rotate(-3deg);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}

  /* Members */
  main{max-width:1100px;margin:0 auto;padding:56px 20px 80px}
  main h2{font-family:'Bungee',sans-serif;color:var(--teal);font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px}
  .card{background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--teal);display:flex;flex-direction:column}
  .photo{aspect-ratio:1/1;background:var(--teal);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:3px solid var(--ink)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .initial{font-family:'Bungee',sans-serif;font-size:4.5rem;color:var(--yellow)}
  .info{padding:14px 16px 18px}
  .name{font-weight:700;font-size:1.3rem}
  .title{display:inline-block;margin-top:8px;background:var(--yellow);border:2px solid var(--ink);padding:2px 10px;font-weight:600;font-size:.95rem}
  .card:nth-child(3n+2) .title{background:var(--red);color:var(--cream)}
  .card:nth-child(3n) .title{background:var(--teal);color:var(--cream)}

  footer{background:var(--teal);color:var(--cream);text-align:center;padding:24px 20px;font-weight:600}
  a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
</style>
</head>
<body>

<header class="hero">
  <h1>Boguda<span>Gang</span></h1>
  <p>Amader dol, amader porichoy.</p>
  <div class="sticker">Since forever</div>
</header>

<main>
  <h2>Amader Shodossho</h2>
  <div class="grid" id="grid"></div>
</main>

<footer>© Boguda Gang</footer>

<script>
  /* ===== EKHANE SHODOSSHO ER TOTTHO BODLAO =====
     name  : shodossho er naam
     title : podobi (jemon "Leader", "Kheyal Rakha Manush")
     photo : photo er file path (jemon "photos/rahim.jpg"). Khali rakhle naam er prothom okkhor dekhabe.
     Notun shodossho add korte ek line copy kore paste koro. */
  const members = [
    { name: "Omar",         title: "Dolpoti",         photo: "photos/omar.jpg" },
    { name: "Shodossho 2",  title: "Podobi 2",        photo: "photos/member2.jpg" },
    { name: "Shodossho 3",  title: "Podobi 3",        photo: "photos/member3.jpg" },
    { name: "Shodossho 4",  title: "Podobi 4",        photo: "photos/member4.jpg" },
    { name: "Shodossho 5",  title: "Podobi 5",        photo: "photos/member5.jpg" },
    { name: "Shodossho 6",  title: "Podobi 6",        photo: "photos/member6.jpg" }
  ];

  const grid = document.getElementById('grid');
  members.forEach(m => {
    const card = document.createElement('article');
    card.className = 'card';

    const photo = document.createElement('div');
    photo.className = 'photo';
    const showInitial = () => {
      photo.innerHTML = '';
      const s = document.createElement('span');
      s.className = 'initial';
      s.textContent = (m.name || '?').trim().charAt(0).toUpperCase();
      photo.appendChild(s);
    };
    if (m.photo) {
      const img = new Image();
      img.alt = m.name;
      img.onerror = showInitial;
      img.src = m.photo;
      photo.appendChild(img);
    } else { showInitial(); }

    const info = document.createElement('div');
    info.className = 'info';
    const n = document.createElement('div');
    n.className = 'name';
    n.textContent = m.name;
    const t = document.createElement('div');
    t.className = 'title';
    t.textContent = m.title;
    info.append(n, t);

    card.append(photo, info);
    grid.appendChild(card);
  });
</script>
</body>
</html>
